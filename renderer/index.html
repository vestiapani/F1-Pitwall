<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>PITWALL — F1 Remote Control</title>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#11151c;
    --panel-2:#151a22;
    --line:#232b38;
    --text:#c9d4e0;
    --text-dim:#5b6b80;
    --cyan:#00d4ff;
    --red:#ff2b4d;
    --amber:#ffb020;
    --green:#17e88f;
    --blue:#3d7bfd;
    --mono: "SFMono-Regular","Consolas","Roboto Mono","Cascadia Mono",monospace;
    --cond: "Oswald","Arial Narrow","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg); color:var(--text);
    font-family:var(--mono);
    height:100%; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    background-color:var(--bg);
    display:flex; flex-direction:column;
  }

  /* ---------- top strip ---------- */
  #topstrip{
    display:flex; align-items:stretch; gap:1px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .tchip{
    background:var(--panel); padding:8px 16px;
    display:flex; align-items:center; gap:10px;
    font-family:var(--cond); letter-spacing:.06em;
  }
  .tchip .label{color:var(--text-dim); font-size:11px; text-transform:uppercase;}
  .tchip .val{font-family:var(--mono); font-size:15px; color:var(--text); font-weight:600;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim); flex:none;}
  .dot.on{background:var(--green); box-shadow:0 0 8px var(--green);}
  .dot.off{background:var(--red); box-shadow:0 0 8px var(--red);}
  #brand{
    margin-left:auto; padding:8px 18px; display:flex; align-items:center; gap:8px;
    font-family:var(--cond); font-weight:700; letter-spacing:.18em; font-size:13px; color:var(--text-dim);
  }
  #brand b{color:var(--red);}

  /* ---------- main grid ---------- */
  #grid{
    flex:1; display:grid; min-height:0;
    grid-template-columns: 320px 1fr 300px;
    grid-template-rows: auto 1fr;
    gap:1px; background:var(--line); padding:1px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel > .hd{
    font-family:var(--cond); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); padding:6px 10px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between;
  }
  .panel > .bd{ padding:10px; flex:1; min-height:0; }

  /* gear / speed block */
  #gearblock{ grid-column:1; grid-row:1/3; align-items:center; }
  #gearblock .bd{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
  #gearval{ font-size:150px; font-weight:800; line-height:1; color:var(--cyan); font-family:var(--cond);}
  #gearval.redline{ color:var(--red); }
  #speedval{ font-size:34px; color:var(--text); letter-spacing:.03em;}
  #speedval span{ font-size:14px; color:var(--text-dim); margin-left:6px;}
  #deltaval{ margin-top:14px; font-size:22px; padding:4px 12px; border:1px solid var(--line); }
  #deltaval.neg{ color:var(--green); border-color:var(--green); }
  #deltaval.pos{ color:var(--red); border-color:var(--red); }

  /* shift light + chart */
  #centercol{ grid-column:2; grid-row:1/3; display:flex; flex-direction:column; gap:1px; background:var(--line);}
  #centercol .panel{ border:none; }
  #rpmpanel .bd{ display:flex; align-items:center; padding:16px 14px; }
  #rpmbar{ display:flex; gap:3px; width:100%; height:26px; }
  .rpmled{ flex:1; background:#1a1f28; border-radius:2px; }
  #rpmnum{ margin-left:14px; font-size:20px; color:var(--text-dim); width:90px; text-align:right; }
  #chartpanel{ flex:1; min-height:0; }
  #chartpanel .bd{ padding:6px; }
  canvas{ width:100%; height:100%; display:block; }

  /* right column: connection stack + tyres + ers/fuel */
  #rightcol{ grid-column:3; grid-row:1/3; display:flex; flex-direction:column; gap:1px; background:var(--line);}
  #rightcol .panel{ border:none; }

  .kv{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line); font-size:12px;}
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--text-dim); }
  .kv .v{ color:var(--text); font-weight:600; }

  #tyresvg{ width:100%; }
  .tyre-readout{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; font-size:13px;}
  .tyre-readout div{ background:var(--panel-2); border:1px solid var(--line); padding:6px 8px; text-align:center; }

  .badge{
    font-family:var(--cond); font-size:10px; letter-spacing:.1em; padding:2px 8px;
    border:1px solid var(--line); color:var(--text-dim); text-transform:uppercase;
  }
  .btn{
    font-family:var(--cond); letter-spacing:.08em; text-transform:uppercase; font-size:11px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:6px 10px; cursor:pointer;
  }
  .btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  .row{ display:flex; gap:6px; margin-top:8px; }
</style>
</head>
<body>

  <div id="topstrip">
    <div class="tchip"><span class="dot" id="dotServer"></span><span class="label">Server</span><span class="val">:3000</span></div>
    <div class="tchip"><span class="dot" id="dotPhone"></span><span class="label">HP</span><span class="val" id="phoneVal">Menunggu…</span></div>
    <div class="tchip"><span class="dot" id="dotVigem"></span><span class="label">ViGEm</span><span class="val" id="vigemVal">Init…</span></div>
    <div class="tchip"><span class="label">IP</span><span class="val" id="ipVal">—</span></div>
    <div class="tchip"><span class="label">Ping</span><span class="val" id="pingVal">—</span></div>
    <div id="brand">PIT<b>WALL</b> · F1 REMOTE</div>
  </div>

  <div id="grid">

    <div class="panel" id="gearblock">
      <div class="hd">GEAR / SPEED</div>
      <div class="bd">
        <div id="gearval">N</div>
        <div id="speedval">0<span>KM/H</span></div>
        <div id="deltaval">+0.000</div>
      </div>
    </div>

    <div id="centercol">
      <div class="panel" id="rpmpanel">
        <div class="hd">RPM <span id="rpmPct">0%</span></div>
        <div class="bd">
          <div id="rpmbar"></div>
          <div id="rpmnum">0</div>
        </div>
      </div>
      <div class="panel" id="chartpanel">
        <div class="hd">SPEED TRACE (60s) <span class="badge">LIVE</span></div>
        <div class="bd"><canvas id="chart"></canvas></div>
      </div>
    </div>

    <div id="rightcol">
      <div class="panel">
        <div class="hd">JARINGAN</div>
        <div class="bd">
          <div class="kv"><span class="k">Alamat IP</span><span class="v" id="ipVal2">—</span></div>
          <div class="kv"><span class="k">Port</span><span class="v">3000</span></div>
          <div class="kv"><span class="k">Status HP</span><span class="v" id="phoneVal2">—</span></div>
          <div class="kv"><span class="k">Latency</span><span class="v" id="pingVal2">—</span></div>
          <div class="row">
            <button class="btn" id="btnUsb">USB Reverse</button>
            <button class="btn" id="btnUsbOff">Lepas</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="hd">BAN &amp; SUHU</div>
        <div class="bd">
          <svg id="tyresvg" viewBox="0 0 120 90">
            <rect x="46" y="18" width="28" height="54" rx="8" fill="none" stroke="#232b38" stroke-width="2"/>
            <rect x="10" y="10" width="14" height="26" rx="3" id="tFL" fill="#1a1f28"/>
            <rect x="96" y="10" width="14" height="26" rx="3" id="tFR" fill="#1a1f28"/>
            <rect x="10" y="54" width="14" height="26" rx="3" id="tRL" fill="#1a1f28"/>
            <rect x="96" y="54" width="14" height="26" rx="3" id="tRR" fill="#1a1f28"/>
          </svg>
          <div class="tyre-readout">
            <div id="txtFL">FL —°</div>
            <div id="txtFR">FR —°</div>
            <div id="txtRL">RL —°</div>
            <div id="txtRR">RR —°</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="hd">ERS / FUEL / DRS</div>
        <div class="bd">
          <div class="kv"><span class="k">Mode ERS</span><span class="v" id="ersMode">NONE</span></div>
          <div class="kv"><span class="k">Energi</span><span class="v" id="ersEnergy">0%</span></div>
          <div class="kv"><span class="k">Bahan Bakar</span><span class="v" id="fuelVal">0.0 KG</span></div>
          <div class="kv"><span class="k">DRS</span><span class="v" id="drsVal">OFF</span></div>
        </div>
      </div>
    </div>

  </div>

<script>
  const TOTAL_LEDS = 20;
  const rpmbar = document.getElementById("rpmbar");
  for (let i = 0; i < TOTAL_LEDS; i++) {
    const d = document.createElement("div");
    d.className = "rpmled";
    rpmbar.appendChild(d);
  }
  const leds = [...rpmbar.children];

  const state = { maxRpm: 13000 };

  function setDot(id, on) {
    const el = document.getElementById(id);
    el.classList.remove("on", "off");
    el.classList.add(on ? "on" : "off");
  }

  // ---- network / status ----
  window.pitwall.on("network-info", ({ ip, port }) => {
    document.getElementById("ipVal").textContent = ip;
    document.getElementById("ipVal2").textContent = ip + ":" + port;
    setDot("dotServer", true);
  });

  window.pitwall.on("phone-status", ({ connected }) => {
    setDot("dotPhone", connected);
    document.getElementById("phoneVal").textContent = connected ? "Terhubung" : "Terputus";
    document.getElementById("phoneVal2").textContent = connected ? "🟢 Terhubung" : "🔴 Terputus";
  });

  window.pitwall.on("vigem-status", ({ connected }) => {
    setDot("dotVigem", connected);
    document.getElementById("vigemVal").textContent = connected ? "Aktif" : "Nonaktif";
  });

  window.pitwall.on("latency", ({ ms }) => {
    document.getElementById("pingVal").textContent = ms + " ms";
    document.getElementById("pingVal2").textContent = ms + " ms";
  });

  document.getElementById("btnUsb").onclick = () => window.pitwall.adbReverse();
  document.getElementById("btnUsbOff").onclick = () => window.pitwall.adbReverseRemove();

  // ---- telemetry ----
  const speedHistory = [];
  const MAX_POINTS = 240; // ~60s at 4Hz

  function tyreColor(t) {
    if (t == null) return "#1a1f28";
    if (t < 85) return "#29b6f6";
    if (t <= 105) return "#17e88f";
    return "#ff2b4d";
  }

  window.pitwall.on("telemetry", (d) => {
    if (d.maxRpm) state.maxRpm = d.maxRpm;

    if (typeof d.gear !== "undefined") {
      const label = d.gear === -1 ? "R" : d.gear === 0 ? "N" : d.gear;
      const gv = document.getElementById("gearval");
      gv.textContent = label;
    }

    if (typeof d.speed !== "undefined") {
      document.getElementById("speedval").innerHTML = Math.round(d.speed) + "<span>KM/H</span>";
      speedHistory.push(d.speed);
      if (speedHistory.length > MAX_POINTS) speedHistory.shift();
      drawChart();
    }

    if (typeof d.rpm !== "undefined") {
      const pct = Math.min(100, Math.round((d.rpm / state.maxRpm) * 100));
      document.getElementById("rpmPct").textContent = pct + "%";
      document.getElementById("rpmnum").textContent = Math.round(d.rpm);
      const lit = Math.round((pct / 100) * TOTAL_LEDS);
      leds.forEach((el, i) => {
        let c = "#1a1f28";
        if (i < lit) {
          if (i >= TOTAL_LEDS - 3) c = "#3d7bfd";
          else if (i >= TOTAL_LEDS * 0.55) c = "#ff2b4d";
          else c = "#17e88f";
        }
        el.style.background = c;
      });
      document.getElementById("gearval").classList.toggle("redline", lit >= TOTAL_LEDS - 3);
    }

    if (typeof d.drs !== "undefined") {
      document.getElementById("drsVal").textContent = d.drs === 1 ? "ON" : "OFF";
    }

    if (typeof d.tyreTemp !== "undefined") {
      const [rl, rr, fl, fr] = d.tyreTemp;
      const map = { tFL: fl, tFR: fr, tRL: rl, tRR: rr };
      for (const [id, t] of Object.entries(map)) {
        document.getElementById(id).setAttribute("fill", tyreColor(t));
      }
      document.getElementById("txtFL").textContent = "FL " + Math.round(fl) + "°";
      document.getElementById("txtFR").textContent = "FR " + Math.round(fr) + "°";
      document.getElementById("txtRL").textContent = "RL " + Math.round(rl) + "°";
      document.getElementById("txtRR").textContent = "RR " + Math.round(rr) + "°";
    }

    if (typeof d.ersMode !== "undefined") {
      const names = ["NONE", "MED", "HOTLAP", "OVERTAKE"];
      document.getElementById("ersMode").textContent = names[d.ersMode] || "NONE";
    }
    if (typeof d.ersEnergy !== "undefined") {
      const pct = Math.min(100, Math.max(0, Math.round((d.ersEnergy / 4000000) * 100))) || 0;
      document.getElementById("ersEnergy").textContent = pct + "%";
    }
    if (typeof d.fuel !== "undefined") {
      document.getElementById("fuelVal").textContent = d.fuel.toFixed(1) + " KG";
    }
    if (typeof d.delta !== "undefined") {
      const el = document.getElementById("deltaval");
      const val = parseFloat(d.delta) || 0;
      el.textContent = (val > 0 ? "+" : "") + val.toFixed(3);
      el.classList.remove("neg", "pos");
      el.classList.add(val < 0 ? "neg" : "pos");
    }
  });

  // ---- oscilloscope-style speed trace ----
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function drawChart() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // grid
    ctx.strokeStyle = "rgba(35,43,56,0.9)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const y = (h / 6) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    if (speedHistory.length < 2) return;
    const max = Math.max(...speedHistory, 100);
    ctx.beginPath();
    ctx.strokeStyle = "#00d4ff";
    ctx.lineWidth = 2 * devicePixelRatio;
    speedHistory.forEach((v, i) => {
      const x = (i / (MAX_POINTS - 1)) * w;
      const y = h - (v / max) * h * 0.92 - 4;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
</script>
</body>
</html>
